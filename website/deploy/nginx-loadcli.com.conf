# www.loadcli.com — site estático servido pelo Nginx do host (sem Docker, sem porta).
# Instalar em /etc/nginx/sites-available/loadcli.com e ligar em sites-enabled.
#
# Molde: /Users/nhkameda/DEV/radiorelogio/deploy/nginx-radiorelogio.com.conf
# Canônico é o www (o apex redireciona), como no huarin.com e no sollar.com.
#
# ATENÇÃO: dentro dos blocos `location` use `expires`, nunca
# `add_header Cache-Control`. Um add_header aninhado cancela a herança de TODOS
# os headers de segurança definidos no nível do server.

# apex -> www
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loadcli.com;

    ssl_certificate     /etc/letsencrypt/live/loadcli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loadcli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.loadcli.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.loadcli.com;

    ssl_certificate     /etc/letsencrypt/live/loadcli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loadcli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/loadcli.com;
    index index.html;

    charset utf-8;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    # Tudo é auto-hospedado: nenhuma origem externa é necessária. O
    # 'unsafe-inline' em style-src cobre os style="--delay:…" das animações e o
    # <noscript><style> que garante o conteúdo com JavaScript desligado.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # HTML curto no cache: é o que muda quando o texto muda.
    location = /index.html { expires 5m; }
    location = /es.html    { expires 5m; }
    location = /zh.html    { expires 5m; }
    location = /pt.html    { expires 5m; }
    location = /en.html    { expires 5m; }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }

    # Assets são versionados por ?v=N, então podem durar.
    location /assets/ { expires 7d; }

    # O DMG é grande e imutável por versão. Nada de add_header aqui: o link no
    # HTML já usa o atributo `download`, e um add_header aninhado derrubaria os
    # headers de segurança herdados.
    location /download/ { expires 30d; }

    location / { try_files $uri $uri/ =404; }
}
